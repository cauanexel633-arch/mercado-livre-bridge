services:
  - type: web
    name: mercado-livre-bridge-pro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BRIDGE_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ML_REDIRECT_URI
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: 30
